  var f = document.getElementById("f"), p = document.getElementById("p"), b = document.getElementById("b"), err = document.getElementById("err");
  var bytes = function (s) { var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; };
  function unlock(pw) {
    pw = pw.replace(/[\s-]/g, "").toUpperCase();
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes("G6EaQXDgYG/51pG0yWpDfA=="), iterations: 600000, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes("tywjZXcSRjxKtenB") }, key, bytes(document.getElementById("c").textContent));
    }).then(function (plain) {
      try { sessionStorage.setItem("slp", pw); } catch (x) {}
      var html = new TextDecoder().decode(plain);
      window.__preview = true;
      document.open(); document.write(html); document.close();
    });
  }
  function ask() { f.hidden = false; p.focus(); }
  f.addEventListener("submit", function (ev) {
    ev.preventDefault(); err.textContent = ""; b.disabled = true; b.textContent = "Opening";
    unlock(p.value).catch(function () { b.disabled = false; b.textContent = "Open"; err.textContent = "That password did not work. Check it and try again."; p.select(); });
  });
  var saved = null;
  try { saved = sessionStorage.getItem("slp"); } catch (x) {}
  if (saved) unlock(saved).catch(ask); else ask();
})();
</script>
</body></html>
